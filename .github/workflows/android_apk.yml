name: Android APK Olustur

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Indir
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Proje Yapisini ve Tum Uygulama Kodlarini Olustur
        run: |
          rm -rf android ios
          flutter create --org com.hidrat --project-name hidrat .

          rm -rf android/app/src/main/kotlin android/app/src/main/java
          mkdir -p android/app/src/main/kotlin/com/hidrat/app
          cat > android/app/src/main/kotlin/com/hidrat/app/MainActivity.kt << 'EOF'
          package com.hidrat.app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity()
          EOF

          mkdir -p assets/images assets/sounds
          mkdir -p lib/providers lib/services lib/screens lib/widgets
          touch assets/images/placeholder.png assets/sounds/placeholder.mp3

          cat > pubspec.yaml << 'EOF'
          name: hidrat
          description: Su Icme Hatirlaticisi - Gunluk su takip uygulamasi
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.1.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            google_mobile_ads: ^5.1.0
            shared_preferences: ^2.2.3
            flutter_local_notifications: ^17.2.2
            intl: ^0.19.0
            provider: ^6.1.2
            fl_chart: ^0.68.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.1

          flutter:
            uses-material-design: true
            assets:
              - assets/images/
              - assets/sounds/
          EOF

          cat > lib/main.dart << 'EOF'
          import 'dart:io';
          import 'package:flutter/foundation.dart';
          import 'package:flutter/material.dart';
          import 'package:provider/provider.dart';
          import 'package:google_mobile_ads/google_mobile_ads.dart';
          import 'providers/su_takip_provider.dart';
          import 'services/bildirim_servisi.dart';
          import 'screens/home_page.dart';
          import 'screens/ayarlar_page.dart';
          import 'screens/istatistik_page.dart';
          import 'screens/hatirlatici_page.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            if (!kIsWeb && (Platform.isAndroid || Platform.isIOS)) {
              try {
                await MobileAds.instance.initialize();
              } catch (e) {
                debugPrint('AdMob baslatilamadi: $e');
              }
            }
            await BildirimServisi().baslat();
            runApp(const HidratApp());
          }

          class HidratApp extends StatelessWidget {
            const HidratApp({super.key});

            @override
            Widget build(BuildContext context) {
              return ChangeNotifierProvider(
                create: (_) => SuTakipProvider()..yukle(),
                child: MaterialApp(
                  title: 'Hidrat',
                  debugShowCheckedModeBanner: false,
                  theme: ThemeData(
                    colorScheme: ColorScheme.fromSeed(
                      seedColor: const Color(0xFF2196F3),
                      brightness: Brightness.light,
                    ),
                    appBarTheme: const AppBarTheme(
                      centerTitle: true,
                      elevation: 0,
                      backgroundColor: Color(0xFF2196F3),
                      foregroundColor: Colors.white,
                    ),
                    useMaterial3: true,
                    fontFamily: 'Roboto',
                  ),
                  home: const AnaEkran(),
                ),
              );
            }
          }

          class AnaEkran extends StatefulWidget {
            const AnaEkran({super.key});

            @override
            State<AnaEkran> createState() => _AnaEkranState();
          }

          class _AnaEkranState extends State<AnaEkran> {
            int _aktifSekme = 0;

            final List<Widget> _sayfalar = const [
              HomePage(),
              IstatistikPage(),
              HatirlaticiPage(),
              AyarlarPage(),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: IndexedStack(
                  index: _aktifSekme,
                  children: _sayfalar,
                ),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: _aktifSekme,
                  onDestinationSelected: (index) {
                    setState(() => _aktifSekme = index);
                  },
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(Icons.water_drop_outlined),
                      selectedIcon: Icon(Icons.water_drop),
                      label: 'Ana Sayfa',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.bar_chart_outlined),
                      selectedIcon: Icon(Icons.bar_chart),
                      label: 'İstatistik',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.alarm_outlined),
                      selectedIcon: Icon(Icons.alarm),
                      label: 'Hatırlatıcı',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.settings_outlined),
                      selectedIcon: Icon(Icons.settings),
                      label: 'Ayarlar',
                    ),
                  ],
                ),
              );
            }
          }
          EOF

          cat > lib/services/bildirim_servisi.dart << 'EOF'
          import 'dart:async';
          import 'dart:io';
          import 'package:flutter/foundation.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';

          class BildirimServisi {
            static final BildirimServisi _instance = BildirimServisi._internal();
            factory BildirimServisi() => _instance;
            BildirimServisi._internal();

            final FlutterLocalNotificationsPlugin _plugin = FlutterLocalNotificationsPlugin();
            bool _baslatildi = false;
            Timer? _periyodikTimer;

            Future<void> baslat() async {
              if (_baslatildi || kIsWeb) return;
              try {
                const androidAyar = AndroidInitializationSettings('@mipmap/ic_launcher');
                const iosAyar = DarwinInitializationSettings(
                  requestAlertPermission: true,
                  requestBadgePermission: true,
                  requestSoundPermission: true,
                );
                const linuxAyar = LinuxInitializationSettings(defaultActionName: 'Uygulamayi Ac');
                const initAyar = InitializationSettings(
                  android: androidAyar,
                  iOS: iosAyar,
                  macOS: iosAyar,
                  linux: linuxAyar,
                );
                await _plugin.initialize(initAyar);
                if (!kIsWeb && Platform.isAndroid) {
                  final androidPlugin = _plugin.resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>();
                  await androidPlugin?.requestNotificationsPermission();
                }
                _baslatildi = true;
              } catch (e) {
                debugPrint('Bildirim servisi baslatilamadi: $e');
              }
            }

            bool sessizSaatteMi(TimeOfDay baslangic, TimeOfDay bitis) {
              final simdi = TimeOfDay.now();
              final simdiDakika = simdi.hour * 60 + simdi.minute;
              final basDakika = baslangic.hour * 60 + baslangic.minute;
              final bitDakika = bitis.hour * 60 + bitis.minute;
              if (basDakika <= bitDakika) {
                return simdiDakika >= basDakika && simdiDakika < bitDakika;
              } else {
                return simdiDakika >= basDakika || simdiDakika < bitDakika;
              }
            }

            Future<void> hatirlaticilariAyarla({
              required bool acik,
              required int siklikDakika,
              required TimeOfDay sessizBaslangic,
              required TimeOfDay sessizBitis,
            }) async {
              _periyodikTimer?.cancel();
              if (!kIsWeb && _baslatildi) {
                try {
                  await _plugin.cancelAll();
                } catch (_) {}
              }
              if (!acik) return;
              _periyodikTimer = Timer.periodic(
                Duration(minutes: siklikDakika.clamp(15, 240)),
                (_) async {
                  if (!sessizSaatteMi(sessizBaslangic, sessizBitis)) {
                    await anlikBildirimGoster(
                      baslik: '💧 Su İçme Zamanı!',
                      icerik: 'Vücudunu susuz bırakma, bir bardak su içmeyi unutma!',
                    );
                  }
                },
              );
              if (!kIsWeb && _baslatildi && (Platform.isAndroid || Platform.isIOS)) {
                try {
                  const detaylar = NotificationDetails(
                    android: AndroidNotificationDetails(
                      'hidrat_hatirlatici_kanal',
                      'Su Hatırlatıcıları',
                      channelDescription: 'Düzenli su içme hatırlatma bildirimleri',
                      importance: Importance.high,
                      priority: Priority.high,
                    ),
                    iOS: DarwinNotificationDetails(),
                  );
                  if (siklikDakika == 60) {
                    await _plugin.periodicallyShow(
                      100,
                      '💧 Su İçme Zamanı!',
                      'Günlük su hedefine ulaşmak için bir bardak su iç!',
                      RepeatInterval.hourly,
                      detaylar,
                      androidScheduleMode: AndroidScheduleMode.inexactAllowWhileIdle,
                    );
                  }
                } catch (e) {
                  debugPrint('Periyodik bildirim kurulamadi: $e');
                }
              }
            }

            Future<bool> anlikBildirimGoster({
              required String baslik,
              required String icerik,
            }) async {
              if (kIsWeb) return false;
              if (!_baslatildi) await baslat();
              if (!_baslatildi) return false;
              try {
                const detaylar = NotificationDetails(
                  android: AndroidNotificationDetails(
                    'hidrat_hatirlatici_kanal',
                    'Su Hatırlatıcıları',
                    channelDescription: 'Düzenli su içme hatırlatma bildirimleri',
                    importance: Importance.high,
                    priority: Priority.high,
                  ),
                  iOS: DarwinNotificationDetails(),
                );
                await _plugin.show(
                  DateTime.now().millisecondsSinceEpoch ~/ 1000,
                  baslik,
                  icerik,
                  detaylar,
                );
                return true;
              } catch (e) {
                debugPrint('Bildirim gonderilemedi: $e');
                return false;
              }
            }
          }
          EOF

          cat > lib/providers/su_takip_provider.dart << 'EOF'
          import 'dart:convert';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import '../services/bildirim_servisi.dart';

          class GunlukSuVerisi {
            final DateTime tarih;
            final String kisaGunAdi;
            final double miktar;
            final bool bugunMu;

            const GunlukSuVerisi({
              required this.tarih,
              required this.kisaGunAdi,
              required this.miktar,
              required this.bugunMu,
            });
          }

          class SuTakipProvider extends ChangeNotifier {
            String kullaniciAdi = 'Kullanıcı';
            int kilo = 70;
            int gunlukHedef = 2500;
            int bardakBoyutu = 250;

            Map<String, int> suGecmisi = {};
            DateTime seciliTarih = DateTime.now();
            int? _sonEklenenMiktar;

            bool hatirlaticiAcik = true;
            int hatirlatmaSikligi = 60;
            TimeOfDay sessizBaslangic = const TimeOfDay(hour: 22, minute: 0);
            TimeOfDay sessizBitis = const TimeOfDay(hour: 8, minute: 0);

            int enIyiSeri = 0;

            int get seciliGunIcilen => suGecmisi[_tarihKey(seciliTarih)] ?? 0;
            int get bugunIcilen => suGecmisi[_tarihKey(DateTime.now())] ?? 0;
            int? get sonEklenenMiktar => _sonEklenenMiktar;

            bool get seciliTarihBugunMu => _tarihKey(seciliTarih) == _tarihKey(DateTime.now());

            String get seciliTarihFormatli {
              if (seciliTarihBugunMu) return 'Bugün';
              final dun = DateTime.now().subtract(const Duration(days: 1));
              if (_tarihKey(seciliTarih) == _tarihKey(dun)) return 'Dün';
              return '${seciliTarih.day.toString().padLeft(2, '0')}.${seciliTarih.month.toString().padLeft(2, '0')}.${seciliTarih.year}';
            }

            static const List<String> _haftaGunleri = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];

            List<GunlukSuVerisi> get haftalikDetayliVeri {
              final bugun = DateTime.now();
              return List.generate(7, (i) {
                final gun = DateTime(bugun.year, bugun.month, bugun.day).subtract(Duration(days: 6 - i));
                final gunAdi = _haftaGunleri[gun.weekday - 1];
                final miktar = (suGecmisi[_tarihKey(gun)] ?? 0).toDouble();
                return GunlukSuVerisi(
                  tarih: gun,
                  kisaGunAdi: gunAdi,
                  miktar: miktar,
                  bugunMu: i == 6,
                );
              });
            }

            List<double> get haftalikVeri => haftalikDetayliVeri.map((g) => g.miktar).toList();

            int get toplamIcilen => suGecmisi.values.fold(0, (a, b) => a + b);

            double get gunlukOrtalama {
              final aktifGunler = suGecmisi.values.where((v) => v > 0).length;
              if (aktifGunler == 0) return 0;
              return toplamIcilen / aktifGunler;
            }

            int get mevcutSeri {
              final bugun = DateTime.now();
              int seri = 0;
              DateTime kontrolGunu = DateTime(bugun.year, bugun.month, bugun.day);
              if ((suGecmisi[_tarihKey(kontrolGunu)] ?? 0) < gunlukHedef) {
                kontrolGunu = kontrolGunu.subtract(const Duration(days: 1));
              }
              while ((suGecmisi[_tarihKey(kontrolGunu)] ?? 0) >= gunlukHedef) {
                seri++;
                kontrolGunu = kontrolGunu.subtract(const Duration(days: 1));
              }
              return seri;
            }

            String _tarihKey(DateTime tarih) =>
                '${tarih.year}-${tarih.month.toString().padLeft(2, '0')}-${tarih.day.toString().padLeft(2, '0')}';

            void _seriHesapla() {
              if (suGecmisi.isEmpty || gunlukHedef <= 0) return;
              final basariliTarihler = suGecmisi.entries
                  .where((e) => e.value >= gunlukHedef)
                  .map((e) => DateTime.tryParse(e.key))
                  .whereType<DateTime>()
                  .map((d) => DateTime(d.year, d.month, d.day))
                  .toList()
                ..sort();

              int maksSeri = 0;
              int anlikSeri = 0;
              DateTime? oncekiGun;

              for (final gun in basariliTarihler) {
                if (oncekiGun == null) {
                  anlikSeri = 1;
                } else {
                  final fark = gun.difference(oncekiGun).inDays;
                  if (fark == 1) {
                    anlikSeri++;
                  } else if (fark > 1) {
                    anlikSeri = 1;
                  }
                }
                if (anlikSeri > maksSeri) maksSeri = anlikSeri;
                oncekiGun = gun;
              }
              if (maksSeri > enIyiSeri) enIyiSeri = maksSeri;
            }

            void suEkle(int ml) {
              if (ml <= 0) return;
              final key = _tarihKey(seciliTarih);
              suGecmisi[key] = (suGecmisi[key] ?? 0) + ml;
              _sonEklenenMiktar = ml;
              _seriHesapla();
              notifyListeners();
              _kaydet();
            }

            void suAzalt(int ml) {
              if (ml <= 0) return;
              final key = _tarihKey(seciliTarih);
              final mevcut = suGecmisi[key] ?? 0;
              final yeniDeger = max(0, mevcut - ml);
              if (yeniDeger == 0) {
                suGecmisi.remove(key);
              } else {
                suGecmisi[key] = yeniDeger;
              }
              _sonEklenenMiktar = null;
              _seriHesapla();
              notifyListeners();
              _kaydet();
            }

            void tarihDegistir(DateTime tarih) {
              seciliTarih = DateTime(tarih.year, tarih.month, tarih.day);
              _sonEklenenMiktar = null;
              notifyListeners();
            }

            void buguneDon() {
              tarihDegistir(DateTime.now());
            }

            void kullaniciAdiGuncelle(String ad) {
              final temizAd = ad.trim();
              if (temizAd.isEmpty) return;
              kullaniciAdi = temizAd;
              notifyListeners();
              _kaydet();
            }

            void kiloGuncelle(int yeniKilo) {
              kilo = yeniKilo.clamp(20, 300);
              gunlukHedef = (kilo * 35).clamp(500, 10000);
              _seriHesapla();
              notifyListeners();
              _kaydet();
            }

            void hedefGuncelle(int hedef) {
              gunlukHedef = hedef.clamp(500, 10000);
              _seriHesapla();
              notifyListeners();
              _kaydet();
            }

            void bardakBoyutuGuncelle(int boyut) {
              bardakBoyutu = boyut.clamp(50, 2000);
              notifyListeners();
              _kaydet();
            }

            void hatirlaticiDegistir(bool deger) {
              hatirlaticiAcik = deger;
              _bildirimleriSenkronizeEt();
              notifyListeners();
              _kaydet();
            }

            void hatirlatmaSikligiGuncelle(int dakika) {
              hatirlatmaSikligi = dakika.clamp(15, 240);
              _bildirimleriSenkronizeEt();
              notifyListeners();
              _kaydet();
            }

            void sessizBaslangicGuncelle(TimeOfDay saat) {
              sessizBaslangic = saat;
              _bildirimleriSenkronizeEt();
              notifyListeners();
              _kaydet();
            }

            void sessizBitisGuncelle(TimeOfDay saat) {
              sessizBitis = saat;
              _bildirimleriSenkronizeEt();
              notifyListeners();
              _kaydet();
            }

            void _bildirimleriSenkronizeEt() {
              BildirimServisi().hatirlaticilariAyarla(
                acik: hatirlaticiAcik,
                siklikDakika: hatirlatmaSikligi,
                sessizBaslangic: sessizBaslangic,
                sessizBitis: sessizBitis,
              );
            }

            void verileriSifirla() {
              suGecmisi.clear();
              enIyiSeri = 0;
              _sonEklenenMiktar = null;
              seciliTarih = DateTime.now();
              notifyListeners();
              _kaydet();
            }

            Future<void> yukle() async {
              final prefs = await SharedPreferences.getInstance();
              kullaniciAdi = prefs.getString('kullaniciAdi') ?? 'Kullanıcı';
              kilo = (prefs.getInt('kilo') ?? 70).clamp(20, 300);
              gunlukHedef = (prefs.getInt('gunlukHedef') ?? 2500).clamp(500, 10000);
              bardakBoyutu = (prefs.getInt('bardakBoyutu') ?? 250).clamp(50, 2000);
              hatirlaticiAcik = prefs.getBool('hatirlaticiAcik') ?? true;
              hatirlatmaSikligi = (prefs.getInt('hatirlatmaSikligi') ?? 60).clamp(15, 240);
              enIyiSeri = max(0, prefs.getInt('enIyiSeri') ?? 0);

              final sessizBasStr = prefs.getString('sessizBaslangic');
              if (sessizBasStr != null) {
                final parts = sessizBasStr.split(':');
                if (parts.length == 2) {
                  sessizBaslangic = TimeOfDay(
                    hour: int.tryParse(parts[0]) ?? 22,
                    minute: int.tryParse(parts[1]) ?? 0,
                  );
                }
              }
              final sessizBitStr = prefs.getString('sessizBitis');
              if (sessizBitStr != null) {
                final parts = sessizBitStr.split(':');
                if (parts.length == 2) {
                  sessizBitis = TimeOfDay(
                    hour: int.tryParse(parts[0]) ?? 8,
                    minute: int.tryParse(parts[1]) ?? 0,
                  );
                }
              }

              final gecmisStr = prefs.getString('suGecmisi');
              if (gecmisStr != null) {
                try {
                  final decoded = json.decode(gecmisStr) as Map<String, dynamic>;
                  suGecmisi = decoded.map((k, v) => MapEntry(k, (v as num).toInt()));
                } catch (_) {}
              }

              _seriHesapla();
              _bildirimleriSenkronizeEt();
              notifyListeners();
            }
            Future<void> _kaydet() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('kullaniciAdi', kullaniciAdi);
              await prefs.setInt('kilo', kilo);
              await prefs.setInt('gunlukHedef', gunlukHedef);
              await prefs.setInt('bardakBoyutu', bardakBoyutu);
              await prefs.setBool('hatirlaticiAcik', hatirlaticiAcik);
              await prefs.setInt('hatirlatmaSikligi', hatirlatmaSikligi);
              await prefs.setInt('enIyiSeri', enIyiSeri);
              await prefs.setString('sessizBaslangic', '${sessizBaslangic.hour}:${sessizBaslangic.minute}');
              await prefs.setString('sessizBitis', '${sessizBitis.hour}:${sessizBitis.minute}');
              await prefs.setString('suGecmisi', json.encode(suGecmisi));
            }
          }
          EOF

          cat > lib/widgets/su_seviyesi_gostergesi.dart << 'EOF'
          import 'dart:math';
          import 'package:flutter/material.dart';

          class SuSeviyesiGostergesi extends StatefulWidget {
            final int icilen;
            final int hedef;

            const SuSeviyesiGostergesi({
              super.key,
              required this.icilen,
              required this.hedef,
            });

            @override
            State<SuSeviyesiGostergesi> createState() => _SuSeviyesiGostergesiState();
          }

          class _SuSeviyesiGostergesiState extends State<SuSeviyesiGostergesi>
              with SingleTickerProviderStateMixin {
            late final AnimationController _dalgaController;

            @override
            void initState() {
              super.initState();
              _dalgaController = AnimationController(
                vsync: this,
                duration: const Duration(seconds: 2),
              )..repeat();
            }

            @override
            void dispose() {
              _dalgaController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final guvenliHedef = max(1, widget.hedef);
              final hamYuzde = (widget.icilen / guvenliHedef * 100);
              final dolulukOrani = (widget.icilen / guvenliHedef).clamp(0.0, 1.0);
              final tamamlandiMi = widget.icilen >= guvenliHedef;

              return Column(
                children: [
                  SizedBox(
                    width: 200,
                    height: 210,
                    child: AnimatedBuilder(
                      animation: _dalgaController,
                      builder: (context, _) {
                        return CustomPaint(
                          painter: _SuDamlasiPainter(
                            dolulukOrani: dolulukOrani,
                            dalgaFazi: _dalgaController.value * 2 * pi,
                          ),
                        );
                      },
                    ),
                  ),
                  const SizedBox(height: 8),
                  Text(
                    '%${hamYuzde.toStringAsFixed(0)}',
                    style: TextStyle(
                      fontSize: 44,
                      fontWeight: FontWeight.bold,
                      color: tamamlandiMi ? Colors.green : const Color(0xFF2196F3),
                    ),
                  ),
                  const SizedBox(height: 4),
                  Text(
                    '${widget.icilen} / ${widget.hedef} ml',
                    style: const TextStyle(fontSize: 18, color: Colors.grey),
                  ),
                  if (tamamlandiMi) ...[
                    const SizedBox(height: 8),
                    Container(
                      padding: const EdgeInsets.symmetric(horizontal: 20, vertical: 8),
                      decoration: BoxDecoration(
                        color: Colors.green,
                        borderRadius: BorderRadius.circular(20),
                      ),
                      child: const Row(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          Icon(Icons.emoji_events, color: Colors.white),
                          SizedBox(width: 8),
                          Text(
                            'Hedef Tamamlandı!',
                            style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold),
                          ),
                        ],
                      ),
                    ),
                  ],
                ],
              );
            }
          }

          class _SuDamlasiPainter extends CustomPainter {
            final double dolulukOrani;
            final double dalgaFazi;

            _SuDamlasiPainter({required this.dolulukOrani, required this.dalgaFazi});

            @override
            void paint(Canvas canvas, Size size) {
              final centerX = size.width / 2;
              final centerY = size.height / 2;
              final radius = min(size.width, size.height) / 2 - 10;

              final arkaplanPaint = Paint()
                ..color = const Color(0xFFE3F2FD)
                ..style = PaintingStyle.fill;
              canvas.drawCircle(Offset(centerX, centerY), radius, arkaplanPaint);

              if (dolulukOrani > 0) {
                final suYuksekligi = max(4.0, radius * 2 * dolulukOrani);
                final suUstY = centerY + radius - suYuksekligi;
                final suRect = Rect.fromLTWH(centerX - radius, suUstY, radius * 2, suYuksekligi);

                final suPaint = Paint()
                  ..shader = const LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [Color(0xFF64B5F6), Color(0xFF1976D2)],
                  ).createShader(suRect);

                canvas.save();
                canvas.clipPath(
                  Path()..addOval(Rect.fromCircle(center: Offset(centerX, centerY), radius: radius)),
                );

                final suPath = Path();
                suPath.moveTo(centerX - radius, suUstY);
                for (double x = centerX - radius; x <= centerX + radius; x += 2) {
                  final y = suUstY + sin((x * 0.04) + dalgaFazi) * 4;
                  suPath.lineTo(x, y);
                }
                suPath.lineTo(centerX + radius, centerY + radius);
                suPath.lineTo(centerX - radius, centerY + radius);
                suPath.close();
                canvas.drawPath(suPath, suPaint);

                final dalgaPaint = Paint()
                  ..color = Colors.white.withOpacity(0.28)
                  ..style = PaintingStyle.fill;
                final dalgaPath = Path();
                dalgaPath.moveTo(centerX - radius, suUstY);
                for (double x = centerX - radius; x <= centerX + radius; x += 2) {
                  final y = suUstY + cos((x * 0.04) - dalgaFazi) * 5;
                  dalgaPath.lineTo(x, y);
                }
                dalgaPath.lineTo(centerX + radius, centerY + radius);
                dalgaPath.lineTo(centerX - radius, centerY + radius);
                dalgaPath.close();
                canvas.drawPath(dalgaPath, dalgaPaint);

                canvas.restore();
              }

              final kenarlikPaint = Paint()
                ..color = const Color(0xFF2196F3)
                ..style = PaintingStyle.stroke
                ..strokeWidth = 3;
              canvas.drawCircle(Offset(centerX, centerY), radius, kenarlikPaint);

              final damlaPath = Path();
              damlaPath.moveTo(centerX, centerY - radius + 24);
              damlaPath.quadraticBezierTo(centerX - 20, centerY - 5, centerX, centerY + 15);
              damlaPath.quadraticBezierTo(centerX + 20, centerY - 5, centerX, centerY - radius + 24);
              canvas.drawPath(
                damlaPath,
                Paint()
                  ..color = Colors.white.withOpacity(0.5)
                  ..style = PaintingStyle.fill,
              );
            }

            @override
            bool shouldRepaint(covariant _SuDamlasiPainter oldDelegate) =>
                oldDelegate.dolulukOrani != dolulukOrani || oldDelegate.dalgaFazi != dalgaFazi;
          }
